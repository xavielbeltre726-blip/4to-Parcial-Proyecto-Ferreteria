<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.cards {
  perspective: 300px;
  height: 700px;
  top: 100%;
}

.card {
  width: 250px;
  height: 350px;
  background: #16161d;
  border: 2px solid #555555;
  border-radius: 5px;
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform .5s;
}

.card:hover {
  transform: translateZ(20px) rotateX(15deg) rotateY(20deg);
}

.card_title {
  color: #fff;
  position: absolute;
  top: 50%;
  right: 20px;
  transform: translateY(80%);
  transition: transform 1s;
  font: 700 1.5rem monospace;
  text-shadow: -1px -1px 0 #944c4c,  
    1px -1px 0 #000,
    1px 1px 0 #000,
     2px 2px 0 #943636;
}

.card:hover .card_title {
  transform: translateZ(12px);
}
</style>

<body>
<div class="cards">
    <figure class="card">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>

</body>
</html>
